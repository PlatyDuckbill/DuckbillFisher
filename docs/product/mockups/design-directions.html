    const shown=fish.filter(f=>(!m.query||f.name.includes(m.query))&&(m.collection==='all'||f.collected!=='수집됨')&&(!m.favoritesOnly||m.favorites.includes(f.id)));
    section.querySelector('[data-count]').textContent=`${shown.length}종`;
    section.querySelector('[data-list]').innerHTML=shown.map(f=>`<div class="dv-fish-row" ${m.selected===f.id?'aria-current="true"':''}><button type="button" class="dv-choose cursor-interaction" data-fish="${f.id}" aria-label="${f.name} 상세 보기"><span class="dv-fish-icon">${icon('fish')}</span><span><span class="dv-fish-name">${f.name}<span class="dv-fish-state">${f.collected}</span></span><span class="dv-fish-secondary"><span class="dv-fish-time" data-state="${f.state}">${f.status}</span><span>${f.place}</span></span></span></button><button type="button" class="dv-favorite cursor-interaction" data-favorite="${f.id}" aria-label="${f.name} 즐겨찾기" aria-pressed="${m.favorites.includes(f.id)}">${m.favorites.includes(f.id)?'★':'☆'}</button></div>`).join('')||'<p class="dv-empty">조건에 맞는 어종이 없습니다.</p>';
    icons();
  }
  function detail(section,index){
    const f=fish.find(f=>f.id===models[index].selected)||fish[0];
    section.querySelector('[data-detail]').innerHTML=`<div class="dv-detail-top"><span class="dv-fish-icon">${icon('fish')}</span><div class="dv-detail-title"><h2>${f.name}</h2><div class="dv-detail-meta"><span>${f.kind}</span><span>${f.collected}</span></div></div></div><div class="dv-state-line" data-state="${f.state}"><span>${f.status}</span><span class="dv-clock">${f.clock}</span></div><div class="dv-actions"><button type="button" data-action="bait" class="cursor-interaction">미끼 찾기</button><button type="button" data-action="map" class="cursor-interaction">지도 보기</button></div><div class="dv-subheading"><h3>낚시 조건</h3><span>${f.place}</span></div><dl class="dv-kv"><dt>미끼</dt><dd>${f.bait}</dd><dt>시간</dt><dd>${f.time}</dd><dt>날씨</dt><dd>${f.weather}</dd><dt>입질·낚아채기</dt><dd>${f.tug}</dd><dt>복수 어획</dt><dd>${f.yield}</dd><dt>최소 획득력</dt><dd>미확인</dd></dl>${f.intuition?`<section class="dv-condition"><div class="dv-subheading"><h3>직감 조건</h3><span>${f.duration}</span></div><p><strong>${f.intuition}</strong></p></section>`:''}${f.delivery?`<div class="dv-delivery">${f.delivery}</div>`:''}<details><summary>메모·캐스팅 타이머 관리</summary><p>메모 저장과 프리셋 연결은 기존 기능을 사용합니다.</p></details><p class="dv-feedback" data-feedback aria-live="polite"></p>`;
    icons();
  }
  function save(index){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{lastInteractedDesign:variants[index]?.name,selectedFish:fish.find(f=>f.id===models[index]?.selected)?.name},privateContent:{models,design}}).catch(()=>{});}
  function applyDesign(){root.style.maxWidth=`${design.width}px`;root.querySelectorAll('.dv-app').forEach(app=>{app.style.maxWidth=`${design.width}px`;app.style.setProperty('--dv-row',design.compact?'54px':'68px');});}
  function mount(){
    variants.forEach((v,index)=>{
      const section=root.querySelector(`[data-variant="${v.name}"]`);
      const m=models[index];
      section.innerHTML=`<article class="dv-app ${v.className}" aria-label="${v.name} 메인 화면"><header class="dv-chrome"><div class="dv-brand">${icon('fish')}<span>DuckbillFisher</span></div><span class="dv-design-label">V2 디자인 제안</span></header><div class="dv-shell"><nav class="dv-nav" aria-label="메인 메뉴">${nav.map(([i,label],n)=>`<span ${n===0?'aria-current="page"':''}>${icon(i)}${label}</span>`).join('')}</nav><main class="dv-workspace"><div class="dv-toolbar"><div class="dv-tool-title"><h3>어종 목록</h3><span class="dv-fish-state" data-count></span></div><div class="dv-shortcuts"><button type="button" data-shortcut="간이 목록" class="cursor-interaction">간이 목록</button><button type="button" data-shortcut="캐스팅 타이머" class="cursor-interaction">캐스팅 타이머</button></div></div><div class="dv-filter"><input type="search" data-search aria-label="어종 이름 검색" placeholder="어종 이름 검색" autocomplete="off"><select data-collection aria-label="수집 필터"><option value="all">전체 어종</option><option value="uncaught">수집 숨김</option></select><label><input type="checkbox" data-favorites-only>즐겨찾기만</label></div><div class="dv-layout"><section class="dv-results" aria-label="어종 목록"><div class="dv-result-heading"><span>어종 · 수집 상태</span></div><div class="dv-fish-list" data-list></div></section><aside class="dv-detail" data-detail aria-label="선택한 어종 상세"></aside></div></main></div><footer class="dv-footer"><span>${v.tag}</span><span>가상 어종·수치 · 디자인 검토용</span></footer></article>`;
      section.querySelector('[data-search]').value=m.query;
      section.querySelector('[data-collection]').value=m.collection;
      section.querySelector('[data-favorites-only]').checked=m.favoritesOnly;
      rows(section,index);detail(section,index);
      section.addEventListener('input',e=>{if(e.target.matches('[data-search]')){m.query=e.target.value;rows(section,index);save(index);}});
      section.addEventListener('change',e=>{if(e.target.matches('[data-collection]'))m.collection=e.target.value;if(e.target.matches('[data-favorites-only]'))m.favoritesOnly=e.target.checked;rows(section,index);save(index);});
      section.addEventListener('click',e=>{
        const b=e.target.closest('button');if(!b)return;
        if(b.dataset.fish){m.selected=b.dataset.fish;rows(section,index);detail(section,index);save(index);}
        if(b.dataset.favorite){const id=b.dataset.favorite;m.favorites=m.favorites.includes(id)?m.favorites.filter(v=>v!==id):[...m.favorites,id];rows(section,index);save(index);}
        if(b.dataset.action)section.querySelector('[data-feedback]').textContent=b.dataset.action==='bait'?'미끼 찾기 · 실제 플러그인에서 게임 미끼 칸을 강조합니다.':'지도 보기 · 실제 플러그인에서 해당 낚시터 지도를 엽니다.';
        if(b.dataset.shortcut)section.querySelector('[data-feedback]').textContent=`${b.dataset.shortcut}는 기존 독립 화면을 사용합니다. 이 시안은 메인 화면 비교용입니다.`;
      });
    });
    applyDesign();icons();
  }
  function restore(snapshot){
    const p=snapshot?.privateContent;
    if(Array.isArray(p?.models))p.models.slice(0,3).forEach((m,i)=>{if(fish.some(f=>f.id===m?.selected))models[i].selected=m.selected;if(typeof m?.query==='string')models[i].query=m.query.slice(0,80);if(['all','uncaught'].includes(m?.collection))models[i].collection=m.collection;if(typeof m?.favoritesOnly==='boolean')models[i].favoritesOnly=m.favoritesOnly;if(Array.isArray(m?.favorites))models[i].favorites=m.favorites.filter(id=>fish.some(f=>f.id===id));});
    if(Number.isFinite(p?.design?.width))design.width=Math.max(320,Math.min(1024,p.design.width));
    if(typeof p?.design?.compact==='boolean')design.compact=p.design.compact;
  }
  restore(window.openai?.widgetState);mount();
  window.addEventListener('openai:set_globals',e=>{const snapshot=e.detail?.globals?.widgetState;if(!snapshot)return;restore(snapshot);variants.forEach((v,i)=>{const section=root.querySelector(`[data-variant="${v.name}"]`);section.querySelector('[data-search]').value=models[i].query;section.querySelector('[data-collection]').value=models[i].collection;section.querySelector('[data-favorites-only]').checked=models[i].favoritesOnly;rows(section,i);detail(section,i);});applyDesign();});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyDesign();save(0);}});tweak.addSlider(design,'width',{label:'화면 폭',min:320,max:1024,step:16,unit:'px'});tweak.addToggle(design,'compact',{label:'목록 간격 좁히기'});}
})();
</script>
