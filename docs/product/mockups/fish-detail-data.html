<script>

  const views = {
    regular:{name:'은빛 강고기',kind:'일반 낚시',status:'상시 출현',time:'시간·날씨 제한 없음',bait:'강물 지렁이',hook:'섬세한 낚아채기',tug:'!',yield:['2마리','3마리'],minimum:'4,000',place:'시안용 강 · 낚시터 A'},
    mooch:{name:'여명 날개고기',kind:'생미끼 연쇄',status:'출현 예정 · 00:12:30 후',time:'ET 14:00–16:00 · 맑음 → 흐림',bait:'강물 지렁이',hook:'강력한 낚아채기',tug:'!!!',yield:['증가 없음 · 1마리','증가 없음 · 1마리'],minimum:'4,100',place:'시안용 호수 · 낚시터 B',mooch:true},
    intuition:{name:'깊은물 왕관고기',kind:'터주왕 · 직감 필요',status:'출현 예정 · 00:12:30 후',time:'ET 14:00–16:00 · 맑음 → 비',bait:'은빛 루어',hook:'강력한 낚아채기',tug:'!!!',yield:['증가 없음 · 1마리','증가 없음 · 1마리'],minimum:'4,200',place:'시안용 호수 · 낚시터 C',intuition:true},
    appraiser:{name:'유리 지느러미',kind:'일반 낚시 · 소장품',status:'상시 출현',time:'시간·날씨 제한 없음',bait:'강물 지렁이',hook:'섬세한 낚아채기',tug:'!',yield:['2마리','3마리'],minimum:'4,000',place:'시안용 강 · 낚시터 D',reward:'appraiser'},
    custom:{name:'비단꼬리 고기',kind:'일반 낚시 · 단골거래',status:'상시 출현',time:'시간·날씨 제한 없음',bait:'바닷물 새우',hook:'강력한 낚아채기',tug:'!!',yield:['증가 없음 · 1마리','증가 없음 · 1마리'],minimum:'3,000',place:'시안용 연안 · 낚시터 E',reward:'custom'},
    spear:{name:'푸른별 작살고기',kind:'작살낚시 · 숨은 어장',status:'어장 출현 조건 있음',time:'선행 어획 후 숨은 어장 출현',minimum:'4,000',place:'시안용 바다 · 숨은 어장 F',spear:true},
    ocean:{name:'먼바다 은줄고기',kind:'먼바다 낚시 · 일반 해역',status:'일반 해역에서 출현',time:'기항 시간대 낮 · 환해류 밖',bait:'바닷물 새우',hook:'강력한 낚아채기',tug:'!!',yield:['3–4마리','5–7마리'],place:'시안용 해역 · 기항지 G',ocean:true},
    oceanIntuition:{name:'심해 푸른왕관',kind:'먼바다 낚시 · 직감 필요',status:'환해류 · 밤 · 직감 필요',time:'세 조건을 모두 충족해야 출현',bait:'특수 미끼 A',hook:'강력한 낚아채기',tug:'!!!',yield:['증가 없음 · 1마리','증가 없음 · 1마리'],place:'시안용 해역 · 기항지 G',ocean:true,intuition:true},

  };
  const section = (title,content,action='') => `<section class="df-section"><div class="df-section-heading"><h3>${title}</h3>${action}</div>${content}</section>`;
  const kv = pairs => `<dl class="df-kv">${pairs.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  const yields = (v) => `이중 ${v.yield[0]}<br>삼중 ${design.incomplete?'미확인':v.yield[1]}`;

  function setup(v) {

  function intuition(v) {

  }

    const cuts='<div class="df-inline"><span class="df-badge">최저 300</span><span class="df-badge">최고 보상 600 이상</span></div>';
    const core=custom?kv([['납품 대상','단골 NPC A · 보상표 단계 5'],['위치','시안용 마을 · X:10.0 Y:12.0'],['주간 요청','미확인'],['주간 보너스','미확인']])+'<div class="df-note">'+cuts+'</div>'+table+'<details><summary>경험치·만족도 기준</summary><table aria-label="가상 단골거래 경험치"><thead><tr><th>소장가치</th><th class="df-end">경험치 · 레벨 99</th></tr></thead><tbody><tr><td>300–449</td><td class="df-end">120,000</td></tr><tr><td>450–599</td><td class="df-end">150,000</td></tr><tr><td>600 이상</td><td class="df-end">180,000</td></tr></tbody></table><p class="df-note">기본 보상 예시 · 만렙이면 경험치 없음<br>만족도: 단계 5 최대 기준 · 증가 없음</p><p class="df-note">내 만족도·주간 잔여 횟수는 미확인</p></details>':
      cuts+table+'<p class="df-note">경험치는 납품 레벨 99 기준의 가상 예시</p><details><summary>납품처 · 여러 지역의 소장품 납품원</summary><p>시안용 마을 · X:10.0 Y:12.0</p><p>시안용 도시 · X:8.0 Y:9.0</p></details>';
    return section(custom?'단골거래 · 소장가치와 보상':'소장품 납품원 · 소장가치와 보상',core,'<button type="button" data-action="delivery">납품처 지도</button>');
  }
  function ocean(v) {
    return section('먼바다 정보',kv([['출현 해역','시안용 해역 · 항로 A / 항로 B'],['출현 구분',v.intuition?'환해류 안 · 밤':'일반 해역 · 낮'],['어종 점수',v.intuition?'기준 500점':'기준 100점'],['임무 분류',v.intuition?'해당 없음':'상어류'],['환해류 유발',v.intuition?'해당 없음':'유발 대상 어종']])+ '<p class="df-note">점수는 기본값 · 대형·항해 보너스 적용 전</p>','<button type="button" data-action="voyage">항로 전체 보기</button>');
  }
  function render() {
    const v=views[picker.value];
    product.style.maxWidth=`${design.width}px`;
    const known=design.incomplete?'<p class="df-caution">삼중 수량·일부 조건 미확인 · 확인된 값만 표시</p>':'';
    const forecast=v.ocean?'':v.spear?'':`<details><summary>다음 출현 · 예측 계산</summary><p>다음 회차 LT 21:00–21:05 · 시각 예시</p>${v.intuition?'<p class="df-note">대상과 선행 어종의 시간·날씨를 구분해 확인</p>':''}<p class="df-note">예측과 실제 준비 상태는 별도로 표시</p></details>`;
    let content=`<div class="df-top"><div class="df-icon"><i data-lucide="fish" aria-hidden="true"></i></div><div class="df-name"><h2>${v.name}</h2><div class="df-meta"><span>${v.kind}</span><span>가상 어종</span></div></div></div>
      <div class="df-actions"><button type="button" data-favorite aria-pressed="false">☆ 즐겨찾기</button><select aria-label="수집 상태"><option>미수집</option><option>수집됨 · 수동</option><option>확인 불가</option></select><button type="button" data-action="guide">어류도감</button></div>
      <div class="df-status ${v.status.includes('예정')||v.spear||v.intuition?'df-wait':''}"><strong>${v.status}</strong><p class="df-sub">${v.time}</p></div><div class="df-location"><span>${v.place}</span><button type="button" data-action="map">지도 열기</button></div>${known}`;
    if(v.reward) content+=`<div class="df-panes" role="group" aria-label="보는 정보"><button type="button" data-pane="fishing" aria-pressed="${panes[picker.value]==='fishing'}">낚시 정보</button><button type="button" data-pane="reward" aria-pressed="${panes[picker.value]==='reward'}">납품·보상</button></div>`;
    if(v.reward && panes[picker.value]==='reward')content+=rewards(v);
    else {
      if(v.ocean) content+=ocean(v);
      content+=setup(v);
      if(v.spear) content+=section('숨은 어장 출현 조건',`<ol class="df-steps"><li>${related('선행 작살어 A')} 10마리<div class="df-sub">소형 · 느림 · 시안용 기본 어장</div></li><li>숨은 어장 F 출현<div class="df-sub">목표 어종: 중형 · 빠름</div></li></ol><p class="df-note">출현 절차 안내 · 현재 어장 출현 여부는 미확인</p>`);
      if(v.intuition) content+=intuition(v);
      if(v.reward)content+='<p class="df-note">소장품: 최저 납품 300 · 최고 보상 600 이상<br>전체 보상표는 납품·보상에서 확인</p>';
      content+=forecast;
    }
    content+='<details><summary>메모·도전 횟수·타이머 프리셋</summary><p>도전 횟수 12회 · 프리셋: 기본</p><p class="df-note">기존 개인 기록 영역 유지</p></details><details><summary>데이터 출처와 확인 범위</summary><p>어종별·필드별 출처, 확인일, 획득력 조건 표시</p><p class="df-note">수량 하한·범위·고정값·미확인을 각각 구분</p></details><div class="df-compare" hidden></div><p class="df-note" data-feedback aria-live="polite"></p><div class="df-footer">가상 어종·가상 수치로 구성한 배치 시안입니다.<br>보상 컷·공략·진행도·시각은 실제 게임 자료가 아닙니다.</div>';
    body.innerHTML=content;
    renderRewards();
    if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:20,height:20}});
  }
  function renderRewards() {
    const tbody=body.querySelector('[data-reward-rows]');
    if(!tbody)return;
    const custom=views[picker.value].reward==='custom';
    const input=body.querySelector('[data-quality]');
    const q=Math.max(0,Number(input.value)||0);
    const bonus=body.querySelector('[data-bonus]')?.value==='1';
    const index=q<300?-1:q<450?0:q<600?1:2;
    const ranges=['300–449','450–599','600 이상'];
    const currency=bonus?[150,180,225]:[100,120,150];
    tbody.innerHTML=ranges.map((range,i)=>`<tr class="${i===index?'df-selected':''}"><td>${range}${i===index?'<br><span class="df-good">입력한 값</span>':''}</td><td class="df-end df-numeric">${currency[i]}</td><td class="df-end df-numeric">${custom?([900,1100,1300][i]*(bonus?1.5:1)).toLocaleString():[120000,150000,180000][i].toLocaleString()}</td></tr>`).join('');
    const cut=body.querySelector('[data-cut]');
    cut.textContent=index<0?`최저 납품 기준까지 ${300-q} 부족`:index===2?'최고 보상 구간 충족':`다음 보상까지 ${[450,600][index]-q} · 최고 보상까지 ${600-q}`;
    if(custom) cut.textContent+=' · 이번 주 적용 여부는 미확인';
  }
  function save(){
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{detailCase:picker.value,detailPane:panes[picker.value]||'fishing'},privateContent:{width:design.width,incomplete:design.incomplete}}).catch(()=>{});
  }
  picker.addEventListener('change',()=>{render();save();});
  body.addEventListener('input',e=>{if(e.target.matches('[data-quality]')){rewardInputs[picker.value].quality=Math.max(0,Number(e.target.value)||0);renderRewards();}});
  body.addEventListener('change',e=>{if(e.target.matches('[data-bonus]')){rewardInputs[picker.value].bonus=e.target.value==='1';renderRewards();}});
  body.addEventListener('click',e=>{
    const button=e.target.closest('button');if(!button)return;
    if(button.dataset.pane){panes[picker.value]=button.dataset.pane;render();save();return;}
    if(button.hasAttribute('data-favorite')){
      const active=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(active));button.textContent=active?'★ 즐겨찾기':'☆ 즐겨찾기';return;
    }
    if(button.dataset.related){
      const panel=body.querySelector('.df-compare');panel.hidden=false;
      panel.innerHTML=`<div class="df-section-heading"><h3>비교 상세 · ${button.dataset.related}</h3><button type="button" data-close-compare>닫기</button></div><p>원래 대상은 그대로 유지</p><p class="df-sub">미끼·입질·낚아채기·이중/삼중 수량 확인</p>`;
      panel.scrollIntoView({block:'nearest'});return;
    }
    if(button.hasAttribute('data-close-compare')){body.querySelector('.df-compare').hidden=true;return;}
    const feedback=body.querySelector('[data-feedback]');
    const messages={map:'지도 열기 위치: 선택한 낚시터 · 시안 동작',delivery:'지도 열기 위치: 선택한 납품처 · 시안 동작',bait:'기존 미끼 찾기 동선 연결 · 시안 동작',guide:'기존 어류도감 열기 동선 연결 · 시안 동작',voyage:'아래 먼바다 시안에서 항로 전체와 같은 상세의 연결을 볼 수 있습니다.'};
    if(button.dataset.action)feedback.textContent=messages[button.dataset.action]||'';
  });
  function restore(state){
    const c=state?.modelContent?.detailCase;
    if(c&&views[c])picker.value=c;
    if(panes[picker.value]&&['fishing','reward'].includes(state?.modelContent?.detailPane))panes[picker.value]=state.modelContent.detailPane;
    const p=state?.privateContent;
    if(p&&Number.isFinite(p.width))design.width=Math.min(680,Math.max(320,p.width));
    if(typeof p?.incomplete==='boolean')design.incomplete=p.incomplete;
    render();
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:()=>{render();save();}});
    tweak.addSlider(design,'width',{label:'상세 폭',min:320,max:680,step:20,unit:'px'});
    tweak.addToggle(design,'incomplete',{label:'일부 자료 미확인 상태'});
  }
})();
</script>
