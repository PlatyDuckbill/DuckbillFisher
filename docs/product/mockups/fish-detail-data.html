<div id="df-detail-proposal" aria-label="상세보기 시안">
  <div class="viz-controls">
    <label class="form-label">미리볼 상황
      <select class="form-select" id="df-detail-case" aria-label="상세보기 상황">
        <option value="regular">일반 낚시 · 기본</option>
        <option value="mooch">일반 낚시 · 생미끼 연쇄</option>
        <option value="intuition">일반 낚시 · 직감 조건</option>
        <option value="appraiser">소장품 · 납품원</option>
        <option value="custom">소장품 · 단골거래</option>
        <option value="spear">작살 · 숨은 어장</option>
        <option value="ocean">먼바다 · 일반 어종</option>
        <option value="oceanIntuition">먼바다 · 환해류 속 직감 어종</option>
        <option value="combined" selected>복합 · 생미끼 + 직감 + 소장품</option>
      </select>
    </label>
  </div>
  <div class="viz-dotted-background df-preview">
    <article class="df-product" aria-label="어종 상세보기 시안">
      <div class="df-titlebar"><span>DuckbillFisher · 어종 상세</span><span>배치 시안</span></div>
      <div class="df-body" id="df-detail-body"></div>
    </article>
  </div>
</div>
<style>
#df-detail-proposal { --df-bg:light-dark(#f4f1e9,#242625); --df-panel:light-dark(#eae6dc,#303330); --df-text:light-dark(#292d2c,#e7e6df); --df-muted:light-dark(#5c625e,#b5b9af); --df-line:light-dark(#c9c8bc,#51574f); --df-accent:light-dark(#655223,#dbc28d); --df-good:light-dark(#235a4a,#a3d3b9); --df-warning:light-dark(#7a451a,#ebc399); --df-spot:light-dark(#e0ebe3,#303e36); --df-attention:light-dark(#ede5d5,#403b30); --df-button:light-dark(#e2dfd5,#3b403b); --df-link:light-dark(#235f70,#acd3df); }
#df-detail-proposal .df-preview { padding:20px 0; }
#df-detail-proposal .df-product { box-sizing:border-box; width:100%; max-width:420px; margin:0 auto; color:var(--df-text); background:var(--df-bg); border:1px solid var(--df-line); border-radius:4px; font:13px/1.5 "Segoe UI","Malgun Gothic",sans-serif; }
#df-detail-proposal .df-titlebar { display:flex; justify-content:space-between; gap:12px; padding:7px 12px; color:var(--df-accent); background:var(--df-panel); border-bottom:1px solid var(--df-line); font-size:12px; }
#df-detail-proposal .df-body { padding:15px; }
#df-detail-proposal .df-product * { box-sizing:border-box; }
#df-detail-proposal .df-product h2 { font-size:19px; font-weight:500; line-height:1.35; margin:0 0 5px; }
#df-detail-proposal .df-product h3 { font-size:13px; font-weight:500; line-height:1.5; color:var(--df-accent); margin:0; }
#df-detail-proposal .df-product p { margin:0; }
#df-detail-proposal .df-product button, #df-detail-proposal .df-product select { font:inherit; color:var(--df-text); border:1px solid var(--df-line); border-radius:3px; background:var(--df-button); padding:4px 7px; max-width:100%; }
#df-detail-proposal .df-product button { cursor:inherit; }
#df-detail-proposal .df-product button[aria-pressed="true"] { color:var(--df-accent); background:var(--df-attention); }
#df-detail-proposal .df-product button:disabled { opacity:.55; }
#df-detail-proposal .df-product .df-icon { display:grid; place-items:center; width:45px; height:45px; background:var(--df-panel); color:var(--df-accent); border:1px solid var(--df-line); border-radius:3px; flex:0 0 auto; }
#df-detail-proposal .df-top { display:flex; align-items:center; gap:11px; }
#df-detail-proposal .df-name { min-width:0; flex:1; }
#df-detail-proposal .df-meta { color:var(--df-muted); font-size:12px; display:flex; gap:9px; flex-wrap:wrap; }
#df-detail-proposal .df-actions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:12px 0; }
#df-detail-proposal .df-section { margin-top:16px; }
#df-detail-proposal .df-section-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px; padding-bottom:5px; border-bottom:1px solid var(--df-line); }
#df-detail-proposal .df-status { padding:9px 11px; background:var(--df-spot); border-left:3px solid var(--df-good); margin-top:12px; }
#df-detail-proposal .df-status.df-wait { background:var(--df-attention); border-left-color:var(--df-accent); }
#df-detail-proposal .df-status strong { font-weight:500; }
#df-detail-proposal .df-sub { font-size:12px; color:var(--df-muted); }
#df-detail-proposal .df-kv { display:grid; grid-template-columns:82px minmax(0,1fr); gap:6px 12px; margin:0; }
#df-detail-proposal .df-kv dt { color:var(--df-muted); }
#df-detail-proposal .df-kv dd { margin:0; min-width:0; overflow-wrap:anywhere; }
#df-detail-proposal .df-inline { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
#df-detail-proposal .df-note { margin-top:7px !important; font-size:12px; color:var(--df-muted); }
#df-detail-proposal .df-location { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-top:9px; color:var(--df-muted); font-size:12px; }
#df-detail-proposal .df-caution { margin-top:8px !important; color:var(--df-warning); font-size:12px; }
#df-detail-proposal .df-bait { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:7px 0; }
#df-detail-proposal .df-link { background:transparent !important; border:0 !important; padding:0 !important; color:var(--df-link) !important; text-align:left; text-decoration:underline; text-underline-offset:3px; }
#df-detail-proposal .df-chain { display:flex; flex-wrap:wrap; gap:10px 14px; margin:5px 0 11px; }
#df-detail-proposal .df-chain-stage { display:flex; align-items:flex-start; gap:7px; min-width:0; }
#df-detail-proposal .df-chain-stage > div { min-width:0; }
#df-detail-proposal .df-product details { margin-top:11px; }
#df-detail-proposal .df-product summary { color:var(--df-muted); padding:5px 0; cursor:inherit; }
#df-detail-proposal .df-product details[open] summary { color:var(--df-accent); margin-bottom:5px; }
#df-detail-proposal .df-delivery { margin-top:12px; padding-top:8px; border-top:1px solid var(--df-line); overflow-wrap:anywhere; }
#df-detail-proposal .df-footer { margin-top:17px; padding-top:8px; border-top:1px solid var(--df-line); color:var(--df-muted); font-size:12px; }
#df-detail-proposal .df-compare { padding:10px; border:1px solid var(--df-line); background:var(--df-panel); margin-top:10px; }
#df-detail-proposal .df-compare[hidden] { display:none; }
@media(max-width:380px) { #df-detail-proposal .df-body { padding:11px; } #df-detail-proposal .df-kv { grid-template-columns:72px minmax(0,1fr); gap:6px 8px; } }
@media(pointer:coarse) { #df-detail-proposal .df-product button, #df-detail-proposal .df-product select, #df-detail-proposal .df-product summary { min-height:44px; } #df-detail-proposal .df-product .df-link { padding:8px 0 !important; } }
</style>
<script>
(() => {
  const root = document.getElementById('df-detail-proposal');
  const body = root.querySelector('#df-detail-body');
  const picker = root.querySelector('#df-detail-case');
  const product = root.querySelector('.df-product');
  const design = { width:420, incomplete:false };
  const views = {
    regular:{name:'은빛 강고기',kind:'일반 낚시',status:'상시 출현',time:'시간·날씨 제한 없음',bait:'강물 지렁이',hook:'섬세한 낚아채기',tug:'!',yield:['2마리','3마리'],minimum:'4,000',place:'시안용 강 · 낚시터 A'},
    mooch:{name:'여명 날개고기',kind:'생미끼 연쇄',status:'출현 예정 · 00:12:30 후',time:'ET 14:00–16:00 · 맑음 → 흐림',bait:'강물 지렁이',hook:'강력한 낚아채기',tug:'!!!',yield:['증가 없음 · 1마리','증가 없음 · 1마리'],minimum:'4,100',place:'시안용 호수 · 낚시터 B',mooch:true},
    intuition:{name:'깊은물 왕관고기',kind:'터주왕 · 직감 필요',status:'출현 예정 · 00:12:30 후',time:'ET 14:00–16:00 · 맑음 → 비',bait:'은빛 루어',hook:'강력한 낚아채기',tug:'!!!',yield:['증가 없음 · 1마리','증가 없음 · 1마리'],minimum:'4,200',place:'시안용 호수 · 낚시터 C',intuition:true},
    appraiser:{name:'유리 지느러미',kind:'일반 낚시 · 소장품',status:'상시 출현',time:'시간·날씨 제한 없음',bait:'강물 지렁이',hook:'섬세한 낚아채기',tug:'!',yield:['2마리','3마리'],minimum:'4,000',place:'시안용 강 · 낚시터 D',reward:'appraiser'},
    custom:{name:'비단꼬리 고기',kind:'일반 낚시 · 단골거래',status:'상시 출현',time:'시간·날씨 제한 없음',bait:'바닷물 새우',hook:'강력한 낚아채기',tug:'!!',yield:['증가 없음 · 1마리','증가 없음 · 1마리'],minimum:'3,000',place:'시안용 연안 · 낚시터 E',reward:'custom'},
    spear:{name:'푸른별 작살고기',kind:'작살낚시 · 숨은 어장',status:'어장 출현 조건 있음',time:'선행 어획 후 숨은 어장 출현',minimum:'4,000',place:'시안용 바다 · 숨은 어장 F',spear:true},
    ocean:{name:'먼바다 은줄고기',kind:'먼바다 낚시 · 일반 해역',status:'일반 해역에서 출현',time:'기항 시간대 낮 · 환해류 밖',bait:'바닷물 새우',hook:'강력한 낚아채기',tug:'!!',yield:['3–4마리','5–7마리'],place:'시안용 해역 · 기항지 G',ocean:true},
    oceanIntuition:{name:'심해 푸른왕관',kind:'먼바다 낚시 · 직감 필요',status:'환해류 · 밤 · 직감 필요',time:'세 조건을 모두 충족해야 출현',bait:'특수 미끼 A',hook:'강력한 낚아채기',tug:'!!!',yield:['증가 없음 · 1마리','증가 없음 · 1마리'],place:'시안용 해역 · 기항지 G',ocean:true,intuition:true},
    combined:{name:'새벽 유리왕관',kind:'생미끼 · 직감 · 소장품',status:'출현 예정 · 00:12:30 후',time:'ET 14:00–16:00 · 맑음 → 비',bait:'강물 지렁이',hook:'강력한 낚아채기',tug:'!!!',yield:['증가 없음 · 1마리','증가 없음 · 1마리'],minimum:'4,200',place:'시안용 호수 · 낚시터 H',mooch:true,intuition:true,reward:'appraiser'}
  };
  const section = (title,content,action='') => `<section class="df-section"><div class="df-section-heading"><h3>${title}</h3>${action}</div>${content}</section>`;
  const kv = pairs => `<dl class="df-kv">${pairs.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  const yields = (v) => `이중 ${v.yield[0].startsWith('증가 없음')?'1마리':v.yield[0]} · 삼중 ${design.incomplete?'미확인':v.yield[1].startsWith('증가 없음')?'1마리':v.yield[1]}`;
  const related = (name) => `<button type="button" class="df-link cursor-interaction" data-related="${name}">${name}</button>`;
  function setup(v) {
    if (v.spear) return section('어종 식별',kv([['크기 / 속도','중형 · 빠름'],['최소 획득력',design.incomplete?'미확인':v.minimum]]));
    const path = v.mooch ? `<div class="df-chain"><div class="df-chain-stage"><div>${v.bait}<div class="df-sub">직접 낚시 · 소지 99개</div></div></div><div class="df-chain-stage"><span>→</span><div>${related('은빛 생미끼 A')}<div class="df-sub">! · 섬세 · 보관 가능<br>시간 제한 없음</div></div></div><div class="df-chain-stage"><span>→</span><div>${related('긴꼬리 생미끼 B')}<div class="df-sub">!! · 강력 · 보관 가능<br>ET 12:00–16:00</div></div></div><div class="df-chain-stage"><span>→</span><div>${v.name}</div></div></div>` : `<div class="df-bait"><i data-lucide="fish-symbol" aria-hidden="true"></i><span>${v.bait}</span><span class="df-sub">소지 99개</span></div>`;
    const fields=[['입질',v.tug],['낚아채기',v.hook],['이중 / 삼중',yields(v)]];
    if (!v.ocean) fields.push(['최소 획득력',design.incomplete?'미확인':v.minimum]);
    if (!v.ocean && v.intuition) fields.push(['필수 조건','전승록 · 지정 루어']);
    return section(v.mooch?'미끼와 생미끼 경로':'잡는 방법',path+kv(fields),'<button type="button" data-action="bait">미끼 찾기</button>');
  }
  function intuition(v) {
    const ocean=v.ocean;
    const duration=design.incomplete?(ocean?'지속 시간 미확인':'지속 시간 미확인 · 예측은 175초 가정'):`${ocean?'20초':'180초'}`;
    return section('직감 조건',`<div class="df-inline"><span>${related('선행 어종 A')} × ${ocean?2:3}</span><span>+</span><span>${related('선행 어종 B')} × ${ocean?1:2}</span><span class="df-sub">· ${duration}</span></div>`);
  }
  function delivery(v) {
    const destination=v.reward==='custom'?'단골 NPC A':'소장품 납품원';
    return `<p class="df-delivery">${destination} · 소장가치 300 / 450 / 600+</p>`;
  }
  function ocean(v) {
    return section('먼바다 정보',kv([['출현 해역','시안용 해역 · 항로 A / 항로 B'],['출현 구분',v.intuition?'환해류 안 · 밤':'일반 해역 · 낮'],['어종 점수',v.intuition?'기준 500점':'기준 100점'],['임무 분류',v.intuition?'해당 없음':'상어류'],['환해류 유발',v.intuition?'해당 없음':'유발 대상 어종']])+ '<p class="df-note">점수는 기본값 · 대형·항해 보너스 적용 전</p>','<button type="button" data-action="voyage">항로 전체 보기</button>');
  }
  function render() {
    const v=views[picker.value];
    product.style.maxWidth=`${design.width}px`;
    const known=design.incomplete?'<p class="df-caution">삼중 수량·일부 조건 미확인 · 확인된 값만 표시</p>':'';
    const forecast=v.ocean?'':v.spear?'':`<details><summary>다음 출현 · 예측 계산</summary><p>다음 회차 LT 21:00–21:05 · 시각 예시</p>${v.intuition?'<p class="df-note">대상과 선행 어종의 시간·날씨를 구분해 확인</p>':''}<p class="df-note">예측과 실제 준비 상태는 별도로 표시</p></details>`;
    let content=`<div class="df-top"><div class="df-icon"><i data-lucide="fish" aria-hidden="true"></i></div><div class="df-name"><h2>${v.name}</h2><div class="df-meta"><span>${v.kind}</span><span>가상 어종</span></div></div></div>
      <div class="df-actions"><button type="button" data-favorite aria-pressed="false">☆ 즐겨찾기</button><select aria-label="수집 상태"><option>미수집</option><option>수집됨 · 수동</option><option>확인 불가</option></select><button type="button" data-action="guide">어류도감</button></div>
      <div class="df-status ${v.status.includes('예정')||v.spear||v.intuition?'df-wait':''}"><strong>${v.status}</strong><p class="df-sub">${v.time}</p></div><div class="df-location"><span>${v.place}</span><button type="button" data-action="map">지도 열기</button></div>${known}`;
    if(v.ocean) content+=ocean(v);
    content+=setup(v);
    if(v.intuition) content+=intuition(v);
    if(v.spear) content+=section('어장 조건',`<p>${related('선행 작살어 A')} × 10 → 숨은 어장 F</p>`);
    if(v.reward)content+=delivery(v);
    content+=forecast+'<details><summary>메모·도전 횟수·타이머 프리셋</summary><p>도전 횟수 12회 · 프리셋: 기본</p></details><details><summary>데이터 출처</summary><p>어종별 출처와 확인 범위</p></details><div class="df-compare" hidden></div><p class="df-note" data-feedback aria-live="polite"></p><div class="df-footer">가상 어종·수치로 구성한 배치 시안</div>';
    body.innerHTML=content;
    if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:20,height:20}});
  }
  function save(){
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{detailCase:picker.value},privateContent:{width:design.width,incomplete:design.incomplete}}).catch(()=>{});
  }
  picker.addEventListener('change',()=>{render();save();});
  body.addEventListener('click',e=>{
    const button=e.target.closest('button');if(!button)return;
    if(button.hasAttribute('data-favorite')){
      const active=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(active));button.textContent=active?'★ 즐겨찾기':'☆ 즐겨찾기';return;
    }
    if(button.dataset.related){
      const panel=body.querySelector('.df-compare');panel.hidden=false;
      panel.innerHTML=`<div class="df-section-heading"><h3>비교 상세 · ${button.dataset.related}</h3><button type="button" data-close-compare>닫기</button></div><p>원래 대상은 그대로 유지</p><p class="df-sub">미끼·입질·낚아채기·이중/삼중 수량 확인</p>`;
      panel.scrollIntoView({block:'nearest'});return;
    }
    if(button.hasAttribute('data-close-compare')){body.querySelector('.df-compare').hidden=true;return;}
    const feedback=body.querySelector('[data-feedback]');
    const messages={map:'지도 열기 위치: 선택한 낚시터 · 시안 동작',delivery:'지도 열기 위치: 선택한 납품처 · 시안 동작',bait:'기존 미끼 찾기 동선 연결 · 시안 동작',guide:'기존 어류도감 열기 동선 연결 · 시안 동작',voyage:'아래 먼바다 시안에서 항로 전체와 같은 상세의 연결을 볼 수 있습니다.'};
    if(button.dataset.action)feedback.textContent=messages[button.dataset.action]||'';
  });
  function restore(state){
    const c=state?.modelContent?.detailCase;
    if(c&&views[c])picker.value=c;
    const p=state?.privateContent;
    if(p&&Number.isFinite(p.width))design.width=Math.min(680,Math.max(320,p.width));
    if(typeof p?.incomplete==='boolean')design.incomplete=p.incomplete;
    render();
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:()=>{render();save();}});
    tweak.addSlider(design,'width',{label:'상세 폭',min:320,max:680,step:20,unit:'px'});
    tweak.addToggle(design,'incomplete',{label:'일부 자료 미확인 상태'});
  }
})();
</script>
