<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출현 일정표 · 개편 시안</title>
<style>
:root{color-scheme:dark;--bg:#11161e;--surface:#1c222b;--line:#374454;--muted:#acb9c8;--blue:#69a8dd;--green:#59bc97}*{box-sizing:border-box}body{background:var(--bg);color:#edf3fa;font:14px/1.4 'Malgun Gothic',sans-serif;margin:20px}button,input,select{font:inherit;color:inherit;background:#2c3745;border:1px solid #49586a;border-radius:3px;padding:4px 9px}button{cursor:pointer}button:hover{background:#3c4e64}button.active{background:#405d7c;border-color:var(--blue)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}input[type=search]{min-width:140px;flex:1}input[type=checkbox]{accent-color:var(--blue)}.review{max-width:1180px;margin:0 auto 12px;color:var(--muted);font-size:12px}.app{max-width:1180px;height:780px;min-height:480px;resize:vertical;overflow:hidden;margin:auto;background:var(--surface);border:1px solid #536172;display:flex;flex-direction:column}.title{padding:8px 12px;background:#29333e;font-weight:600}.nav{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:18px;white-space:nowrap;font-size:13px;color:var(--muted);overflow-x:auto}.nav b{color:#e2c58b}.tools{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.row label{display:inline-flex;gap:5px;align-items:center;font-size:12px}.content{min-height:0;flex:1;padding:0 12px 8px;display:flex;flex-direction:column}.range{color:var(--muted);font-size:12px;padding:4px 0 7px}.graph{flex:1;min-height:80px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.ghead,.grow{display:grid;grid-template-columns:235px minmax(0,1fr) 36px;align-items:center}.ghead{height:28px;position:sticky;top:0;z-index:5;background:#2a3440;color:var(--muted);font-size:12px}.grow{height:42px;border-bottom:1px solid #303c4b}.grow:nth-child(odd){background:#232c38}.fish{display:flex;align-items:center;gap:8px;min-width:0;padding:3px 7px}.icon{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;background:#3e657e;border-radius:3px;font-size:18px}.fishname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fish small{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track,.scale{position:relative;height:100%;margin-right:8px}.track{background-image:linear-gradient(to right,#48576c70 1px,transparent 1px);background-size:var(--step) 100%}.tick{position:absolute;transform:translateX(-50%);top:6px;white-space:nowrap}.tick:first-child{transform:none}.bar{position:absolute;top:12px;height:19px;min-width:3px;border:0;padding:0;background:var(--blue)}.bar.live{background:var(--green)}.bar.selected{outline:2px solid #fff;outline-offset:2px}.now{position:absolute;top:0;bottom:0;width:1px;background:#e4b667;pointer-events:none}.pin{padding:1px 6px;margin:3px;color:#cbdced}.selection{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}.selection .fish{min-width:180px;flex:1}.selection time{font-variant-numeric:tabular-nums}.other{padding-top:6px;color:var(--muted);font-size:12px}.other summary{cursor:pointer}.other table{width:100%;border-collapse:collapse}.other td{padding:7px;border-bottom:1px solid var(--line)}.monthnav{display:flex;gap:12px;align-items:center;padding:5px 0 10px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);height:23px}.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:0 0 55%;min-height:145px;border-top:1px solid var(--line);border-left:1px solid var(--line)}.date{padding:4px 6px;border-radius:0;border:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:transparent;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:3px;font-size:11px;min-height:0}.date strong{font-size:12px}.date.today strong{color:#f2c475}.date.chosen{background:#344e6b}.date span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-height:15px}.date .more{color:var(--muted);margin-top:auto}.daytitle{font-size:13px;margin:8px 0}.daylist{flex:1;min-height:50px;overflow:auto}.dayrow{display:grid;grid-template-columns:180px minmax(0,1fr) 35px 58px;align-items:center;height:42px;border-top:1px solid var(--line);font-size:12px}.empty{color:var(--muted);padding:12px}dialog{background:var(--surface);color:#edf3fa;border:1px solid #718096;padding:20px;max-width:390px}dialog::backdrop{background:#0009}[hidden]{display:none!important}@media(max-width:800px){body{margin:8px}.ghead,.grow{grid-template-columns:170px minmax(0,1fr) 32px}.dayrow{grid-template-columns:135px minmax(0,1fr) 30px 50px}.date{padding:3px}.selection{flex-wrap:wrap}.date span{font-size:10px}.nav{gap:10px}.fish{gap:5px}.icon{width:24px;height:24px}}
</style></head><body>
<p class="review">개편 시안 · 모든 어종·지역·출현 시각은 가상 자료입니다. 🐟 표식은 게임 아이콘의 자리 표시입니다. 실제 게임 연결·예측 계산은 없습니다.</p>
<main class="app"><div class="title">DuckbillFisher</div><nav class="nav"><span>어종 목록</span><span>수집 현황</span><b>출현 일정표</b><span>즐겨찾기 관리</span><span>낚시 기록</span><span>설정</span></nav>
<div class="tools"><div class="row"><button id="timelineMode" class="active">시간축</button><button id="monthMode">월 달력</button><select id="source" aria-label="표시 대상"><option value="all">현재 필터 어종</option><option value="favorites">즐겨찾기</option></select><input id="search" type="search" placeholder="어종·낚시터 검색…" aria-label="검색"></div><div class="row"><span id="periods"><button data-h="1">1시간</button> <button data-h="3" class="active">3시간</button> <button data-h="6">6시간</button> <button data-h="12">12시간</button> <button data-h="24">24시간</button></span><label><input id="hideCaught" type="checkbox" checked>수집한 어종 숨기기</label><label id="emphasisLabel"><input id="emphasize" type="checkbox" checked>동시 출현 강조</label><button id="eyes" aria-pressed="false" title="물고기의 눈 가정 전환 예시">물고기의 눈</button></div></div>
<section class="content" id="timeline"><div class="range" id="range"></div><div class="graph"><div class="ghead"><span>어종 / 지역</span><div class="scale" id="scale"></div><span></span></div><div id="graphRows"></div></div><div id="selection" hidden></div><details class="other"><summary>시간축에 표시하지 않는 어종 · 3종</summary><table><tr><td>가상 어종 X</td><td>상시 출현</td></tr><tr><td>가상 어종 Y</td><td>조건 미확인</td></tr><tr><td>가상 어종 Z</td><td>표시 기간 내 출현 없음</td></tr></table></details></section>
<section class="content" id="calendar" hidden><div class="monthnav"><button id="prev" aria-label="이전 달">‹</button><strong id="monthTitle" title="날짜 칸은 어종별 첫 출현을 요약합니다. 날짜를 누르면 모든 가상 회차를 확인합니다."></strong><button id="next" aria-label="다음 달">›</button><button id="today">오늘</button></div><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="monthgrid" id="monthGrid"></div><div class="daytitle" id="dayTitle"></div><div class="daylist" id="dayList"></div></section></main>
<dialog id="detail"><h3>어종 상세 / 지도 연결 위치</h3><p>이 시안은 가상 자료입니다. 실제 플러그인에서는 해당 어종 상세나 지도 핀을 엽니다.</p><form method="dialog"><button>닫기</button></form></dialog>
<script>
(function(){
'use strict';var $=function(id){return document.getElementById(id);};var hours=3,mode='timeline',chosen=null,month=new Date(2026,9,1),day=21;
var fish=Array.from({length:28},function(_,i){return {id:i,name:'가상 어종 '+String.fromCharCode(65+i%26)+(i>25?'2':''),zone:'예시 지역 '+(i%6+1),caught:i%9===0};});
function targets(){var q=$('search').value.trim();return fish.filter(function(f){return ($('source').value==='all'||f.id%3===0)&&(!$('hideCaught').checked||!f.caught)&&(!q||(f.name+' '+f.zone).includes(q));});}
function icon(f){return '<div class="fish"><span class="icon" aria-hidden="true">🐟</span><span class="fishname">'+f.name+'<small>'+f.zone+'</small></span></div>';}
function clock(minutes){var d=new Date(Date.UTC(2026,9,21,12,30)+minutes*60000);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');}
function pct(t){return (t+30)/(hours*60+30)*100;}
function intervals(f){var result=[];for(var t=(f.id%5)*8-10;t<hours*60;t+=75+(f.id%4)*10){result.push({start:t,end:t+5+f.id%13});}return result;}
function renderTimeline(){var items=targets();$('range').textContent='10-21 12:00 → '+clock(hours*60)+' · '+items.length+'종';var step=hours<=3?30:hours<=6?60:hours<=12?120:240;var ticks='';for(var t=-30;t<=hours*60;t+=step){ticks+='<span class="tick" style="left:'+pct(t)+'%">'+clock(t)+'</span>';}$('scale').innerHTML=ticks;$('graphRows').innerHTML=items.map(function(f){return '<div class="grow">'+icon(f)+'<div class="track" style="--step:'+(step/(hours*60+30)*100)+'%">'+intervals(f).map(function(w){var active=chosen&&chosen.id===f.id&&chosen.start===w.start;return '<button class="bar '+(w.start<=0?'live ':'')+(active?'selected':'')+'" data-f="'+f.id+'" data-start="'+w.start+'" data-end="'+w.end+'" style="left:'+pct(w.start)+'%;width:'+((w.end-w.start)/(hours*60+30)*100)+'%" title="'+f.name+' · '+clock(w.start)+' → '+clock(w.end)+'" aria-label="'+f.name+' '+clock(w.start)+'부터 '+clock(w.end)+'"></button>';}).join('')+'<span class="now" style="left:'+pct(0)+'%"></span></div><button class="pin" data-action="map" aria-label="'+f.name+' 지도 핀">⌖</button></div>';}).join('');$('selection').hidden=!chosen;if(chosen){var f=fish[chosen.id];$('selection').className='selection';$('selection').innerHTML=icon(f)+'<time>'+clock(chosen.start)+' → '+clock(chosen.end)+'</time><button data-action="map">⌖</button><button data-action="detail">어종 상세</button><button id="clear" aria-label="선택한 일정 닫기">×</button>';}}
function dayEntries(n){var list=[];targets().forEach(function(f){if((f.id+n)%4===0)return;var hour=(f.id*3+n)%23;list.push({f:f,time:String(hour).padStart(2,'0')+':'+(f.id%2?'20':'40')});if(f.id%4===0)list.push({f:f,time:String((hour+8)%24).padStart(2,'0')+':10'});});return list.sort(function(a,b){return a.time.localeCompare(b.time);});}
function renderCalendar(){var y=month.getFullYear(),m=month.getMonth(),count=new Date(y,m+1,0).getDate();if(day>count)day=count;$('monthTitle').textContent=y+'년 '+(m+1)+'월';var html='';for(var empty=0;empty<month.getDay();empty++)html+='<span class="date"></span>';for(var n=1;n<=count;n++){var entries=dayEntries(n),seen=new Set(),unique=entries.filter(function(e){if(seen.has(e.f.id))return false;seen.add(e.f.id);return true;});html+='<button class="date '+(n===day?'chosen ':'')+(y===2026&&m===9&&n===21?'today':'')+'" data-day="'+n+'"><strong>'+n+'</strong>'+unique.slice(0,2).map(function(e){return '<span>'+e.time+' - '+e.f.name+'</span>';}).join('')+(unique.length>2?'<span class="more">+'+(unique.length-2)+'종 더 보기</span>':'')+'</button>';}$('monthGrid').innerHTML=html;var slots=dayEntries(day);$('dayTitle').textContent=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0')+' · '+new Set(slots.map(function(e){return e.f.id;})).size+'종 · '+slots.length+'회';$('dayList').innerHTML=slots.map(function(e){return '<div class="dayrow"><time>'+e.time+' → '+e.time.slice(0,3)+'55</time>'+icon(e.f)+'<button class="pin" data-action="map">⌖</button><button data-action="detail">상세</button></div>';}).join('')||'<p class="empty">표시할 일정이 없습니다.</p>';}
function render(){$('timeline').hidden=mode!=='timeline';$('calendar').hidden=mode!=='calendar';$('periods').hidden=mode!=='timeline';$('emphasisLabel').hidden=mode!=='timeline';$('timelineMode').classList.toggle('active',mode==='timeline');$('monthMode').classList.toggle('active',mode==='calendar');document.querySelectorAll('[data-h]').forEach(function(b){b.classList.toggle('active',Number(b.dataset.h)===hours);});if(mode==='timeline')renderTimeline();else renderCalendar();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='timelineMode')mode='timeline';else if(b.id==='monthMode')mode='calendar';else if(b.dataset.h)hours=Number(b.dataset.h);else if(b.dataset.f)chosen={id:Number(b.dataset.f),start:Number(b.dataset.start),end:Number(b.dataset.end)};else if(b.dataset.day)day=Number(b.dataset.day);else if(b.id==='clear')chosen=null;else if(b.id==='prev'){month=new Date(month.getFullYear(),month.getMonth()-1,1);day=1;}else if(b.id==='next'){month=new Date(month.getFullYear(),month.getMonth()+1,1);day=1;}else if(b.id==='today'){month=new Date(2026,9,1);day=21;}else if(b.dataset.action){$('detail').showModal();return;}else if(b.id==='eyes'){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');b.classList.toggle('active');}render();});['source','hideCaught','emphasize'].forEach(function(id){$(id).addEventListener('change',render);});$('search').addEventListener('input',render);render();
})();
</script></body></html>
